title: Michael Maben
description: Detection Engineer | Security Operations | Cleared Professional
url: "https://michaelmaben.com"
baseurl: ""

author:
  name: Michael Maben
  email: ""
  linkedin: "https://linkedin.com/in/michaelmaben"
  github: "https://github.com/mabenml"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

# Collections
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Pagination (optional future use)
# paginate: 10
# paginate_path: "/blog/page:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
